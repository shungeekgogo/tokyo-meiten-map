<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>駅ちか名店マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F3F5F4; --panel:#FFFFFF; --ink:#1B2528; --muted:#5E6B70; --line:#DCE2E1;
  --accent:#27466E; --accent-soft:#E4EAF3; --gold:#9A6B00; --gold-soft:#FBF1D9;
  --chip:#EDF0EF; --pref-line:#8B4FA8; --shadow:0 1px 2px rgba(20,30,35,.06),0 4px 16px rgba(20,30,35,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#11181B; --panel:#182226; --ink:#E6ECEC; --muted:#9AA8AC; --line:#2A373C;
    --accent:#8FB0DC; --accent-soft:#223249; --gold:#E7BC57; --gold-soft:#3A2F14;
    --chip:#222E33; --pref-line:#E8B8FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#11181B; --panel:#182226; --ink:#E6ECEC; --muted:#9AA8AC; --line:#2A373C;
  --accent:#8FB0DC; --accent-soft:#223249; --gold:#E7BC57; --gold-soft:#3A2F14;
  --chip:#222E33; --pref-line:#E8B8FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:800 22px/1.2 "Shippori Mincho B1","Hiragino Mincho ProN",serif;margin:0;letter-spacing:.04em}
.brand small{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-label{font-size:11px;letter-spacing:.12em;color:var(--muted);width:3.2em;flex:none}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.area-grp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.area-grp:last-child{border-right:none}
.area-tag{font-size:11px;color:var(--muted);letter-spacing:.08em;padding:0 2px 0 4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

main{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
#side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;position:relative}
#map{min-height:0;background:var(--ground)}
.list-head{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list-head h2{font:800 17px/1.3 "Shippori Mincho B1",serif;margin:0;text-wrap:balance}
.list-head span{color:var(--muted);font-size:12px;white-space:nowrap}
ol{list-style:none;margin:0;padding:0 8px 12px}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover,.item.active{background:var(--accent-soft)}
.rank{font:800 18px/1.2 "Shippori Mincho B1",serif;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.item:nth-child(-n+3) .rank{color:var(--gold)}
.name{font-weight:700;font-size:15px;line-height:1.35}
.meta{color:var(--muted);font-size:12px;display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.score{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right;line-height:1.2}
.score small{display:block;font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.05em}
.score.na{font-size:12px;color:var(--muted);font-weight:500}
.empty{padding:24px 16px;color:var(--muted)}
.note{margin:4px 16px 18px;padding:10px 12px;border-radius:8px;background:var(--chip);font-size:12px;color:var(--muted)}
.note b{color:var(--ink)}

#detail{position:absolute;inset:0;background:var(--panel);overflow:auto;padding:14px 16px 24px}
.back{border:none;background:none;color:var(--accent);cursor:pointer;padding:4px 0;font-size:13px}
.d-genre{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.d-name{font:800 24px/1.3 "Shippori Mincho B1",serif;margin:4px 0 10px;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:13px}
.facts dt{color:var(--muted);font-size:12px;letter-spacing:.06em}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700}
.summary{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0 0 16px}
.summary h3,.links h3{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0 0 4px;font-weight:500}
.summary p{margin:0}
.links{display:flex;flex-direction:column;gap:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font-size:13px;text-align:center;background:var(--panel)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);grid-column:1/-1;font-weight:700}
.btn.primary:hover{color:var(--panel);opacity:.9}
.fine{font-size:11px;color:var(--muted);margin-top:10px}

.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px/1 "Zen Kaku Gothic New",sans-serif}
.pin.sel{outline:3px solid var(--gold);outline-offset:1px}
.st-label{background:var(--ink);color:var(--panel);font:700 12px/1 "Zen Kaku Gothic New",sans-serif;padding:4px 7px;border-radius:4px;white-space:nowrap;box-shadow:var(--shadow)}
.leaflet-container{font-family:inherit}
.tiles-light{filter:brightness(1.05) saturate(.85)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(1.3) contrast(.82) saturate(.5)}
.leaflet-tooltip{font-family:inherit}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:46vh auto}
  #map{grid-row:1}
  #side{grid-row:2;border-right:none;border-top:1px solid var(--line);overflow:visible}
  #detail{position:static}
  body{height:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const toRad = d => d*Math.PI/180;
function distM(a,b){
  const R=6371000, dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const RESTAURANTS = RAW.map((r,i)=>{
  const [n,g,lat,lng,s,bmin,bmax,area,note,url]=r;
  const o={id:i,n,g,lat,lng,s,bmin,bmax,area,note,url};
  let best=null;
  for(const st of STATIONS){const d=distM(o,st); if(!best||d<best.d) best={st,d};}
  o.st=best.st; o.d=best.d;
  return o;
});
const G = Object.fromEntries(GENRES.map(g=>[g.id,g]));
const RADIUS = 1600;

const state = {station:'all', genre:'all', budget:'any', sel:null};
try{
  const saved=JSON.parse(localStorage.getItem('meiten-filter')||'null');
  if(saved){ Object.assign(state, {station:saved.station||'all', genre:saved.genre||'all', budget:saved.budget||'any'}); }
}catch(e){}

function chip(label, pressed, onClick, color){
  const b=document.createElement('button');
  b.className='chip'; b.type='button'; b.setAttribute('aria-pressed', pressed);
  if(color){const d=document.createElement('span'); d.className='dot'; d.style.background=color; b.append(d);}
  b.append(label); b.onclick=onClick; return b;
}
function renderFilters(){
  const sr=document.getElementById('stationRow'), gr=document.getElementById('genreRow'), br=document.getElementById('budgetRow');
  [sr,gr,br].forEach(r=>{while(r.children.length>1) r.lastChild.remove();});
  sr.append(chip('すべて', state.station==='all', ()=>set({station:'all'})));
  AREAS.forEach(a=>{
    const grp=document.createElement('span'); grp.className='area-grp';
    const t=document.createElement('span'); t.className='area-tag'; t.textContent=a.name; grp.append(t);
    a.ids.forEach(id=>{const s=STATIONS.find(x=>x.id===id); grp.append(chip(s.name, state.station===s.id, ()=>set({station:s.id})));});
    sr.append(grp);
  });
  GENRES.forEach(g=>gr.append(chip(g.name, state.genre===g.id, ()=>set({genre:g.id}), g.id==='all'?null:g.color)));
  BUDGETS.forEach(b=>br.append(chip(b.name, state.budget===b.id, ()=>set({budget:b.id}))));
}
function set(p){
  Object.assign(state,p,{sel:null});
  try{localStorage.setItem('meiten-filter',JSON.stringify({station:state.station,genre:state.genre,budget:state.budget}));}catch(e){}
  render(true);
}
const yen = v => '¥'+v.toLocaleString('ja-JP');
const walk = d => `徒歩約${Math.max(1,Math.round(d/80))}分`;

function currentList(){
  const bmax=BUDGETS.find(b=>b.id===state.budget).max;
  return RESTAURANTS
    .filter(r=>state.genre==='all'||r.g===state.genre)
    .filter(r=>state.station==='all'||(r.st.id===state.station&&r.d<=RADIUS))
    .filter(r=>r.bmin<=bmax)
    .sort((a,b)=>(b.s??0)-(a.s??0))
    .slice(0,10);
}

// 地図
const map=L.map('map',{zoomControl:true}).setView([35.664,139.728],13);
const dark=()=>{
  const t=document.documentElement.getAttribute('data-theme');
  return t? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
};
let tiles;
function setTiles(){
  if(tiles) map.removeLayer(tiles);
  // 国土地理院 淡色地図（APIキー不要・出典表示で利用可）
  tiles=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{
    maxZoom:19, maxNativeZoom:18, minZoom:5, className: dark()?'tiles-dark':'tiles-light',
    attribution:'出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
  }).addTo(map);
}
setTiles();

// 都道府県境（隣接する都道府県の境界線）
let borderLayer;
function drawBorders(){
  if(!window.PREF_BORDERS) return;
  if(borderLayer) map.removeLayer(borderLayer);
  const color=getComputedStyle(document.documentElement).getPropertyValue('--pref-line').trim();
  const lines=window.PREF_BORDERS.map(l=>l.map(([lng,lat])=>[lat,lng]));
  borderLayer=L.polyline(lines,{color,weight:3,opacity:1,dashArray:'10 6',lineCap:'round',interactive:false}).addTo(map);
  borderLayer.bringToBack();
}
drawBorders();
map.attributionControl.addAttribution('都道府県境：地球地図日本');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{setTiles();drawBorders();});

const stationLayer=L.layerGroup().addTo(map);
const markerLayer=L.layerGroup().addTo(map);
let markers={};

function drawStations(){
  stationLayer.clearLayers();
  STATIONS.forEach(s=>{
    const on=state.station===s.id;
    if(on) L.circle([s.lat,s.lng],{radius:RADIUS,color:'#27466E',weight:1,dashArray:'4 4',fillOpacity:.05}).addTo(stationLayer);
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="st-label">${s.name}駅</div>`,iconSize:null,iconAnchor:[24,12]}),zIndexOffset:-100})
      .on('click',()=>set({station:s.id})).addTo(stationLayer);
  });
}
function pinIcon(r,rank,sel){
  return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,28],
    html:`<div class="pin${sel?' sel':''}" style="background:${G[r.g].color}"><span>${rank}</span></div>`});
}

function render(fit){
  renderFilters();
  const list=currentList();
  const st=STATIONS.find(s=>s.id===state.station);
  const g=G[state.genre];
  document.getElementById('listTitle').textContent=`${st?st.name+'駅周辺':'全駅'}・${g.name} トップ10`;
  document.getElementById('listCount').textContent=`${list.length}件`;
  const ol=document.getElementById('list'); ol.innerHTML='';
  if(!list.length){ol.innerHTML='<li class="empty">この条件に合う店はまだ登録されていません。駅か料理ジャンルを変えてみてください。</li>';}
  list.forEach((r,i)=>{
    const li=document.createElement('li'); li.className='item'+(state.sel===r.id?' active':''); li.tabIndex=0;
    li.innerHTML=`<div class="rank">${i+1}</div>
      <div><div class="name">${r.n}</div>
      <div class="meta"><span><span class="dot" style="display:inline-block;background:${G[r.g].color};margin-right:4px"></span>${G[r.g].name}</span><span>${r.st.name}駅 ${walk(r.d)}</span><span>${yen(r.bmin)}〜${yen(r.bmax)}</span></div></div>
      ${r.s!=null?`<div class="score">${r.s.toFixed(2)}<small>食べログ</small></div>`:`<div class="score na">百名店</div>`}`;
    li.onclick=()=>select(r.id);
    li.onkeydown=e=>{if(e.key==='Enter')select(r.id);};
    ol.append(li);
  });
  markerLayer.clearLayers(); markers={};
  list.forEach((r,i)=>{
    const m=L.marker([r.lat,r.lng],{icon:pinIcon(r,i+1,state.sel===r.id),zIndexOffset:state.sel===r.id?1000:0})
      .bindTooltip(`${i+1}. ${r.n}`,{direction:'top',offset:[0,-26]})
      .on('click',()=>select(r.id)).addTo(markerLayer);
    markers[r.id]=m;
  });
  drawStations();
  if(fit){
    const pts=list.map(r=>[r.lat,r.lng]);
    if(st) pts.push([st.lat,st.lng]);
    if(pts.length) map.fitBounds(pts,{padding:[40,40],maxZoom:16});
  }
  showDetail();
}

function select(id){
  state.sel=id; render(false);
  const r=RESTAURANTS[id]; map.flyTo([r.lat,r.lng],Math.max(map.getZoom(),15),{duration:.6});
}

function q(s){return encodeURIComponent(s);}
function showDetail(){
  const box=document.getElementById('detail'), lv=document.getElementById('listView');
  if(state.sel==null){box.hidden=true; lv.hidden=false; return;}
  const r=RESTAURANTS[state.sel], g=G[r.g];
  const key=`${r.n} ${r.area}`;
  const gm=`https://www.google.com/maps/search/?api=1&query=${q(key)}`;
  const official=r.url
    ?`<a class="btn primary" href="${r.url}" target="_blank" rel="noopener">公式サイトを開く</a>`
    :`<a class="btn primary" href="https://www.google.com/search?q=${q(r.n+' '+r.area+' 公式サイト')}" target="_blank" rel="noopener">公式サイトを検索</a>`;
  box.innerHTML=`
    <button class="back" type="button" id="back">← ランキングに戻る</button>
    <div class="d-genre"><span class="dot" style="background:${g.color}"></span>${g.name}・${r.area}</div>
    <h2 class="d-name">${r.n}</h2>
    <dl class="facts">
      <dt>評価</dt><dd>${r.s!=null?`<b style="font-size:18px">${r.s.toFixed(2)}</b>（食べログ）`:'スコア未確認'}　<span class="badge">${g.hy}</span></dd>
      <dt>予算</dt><dd>${yen(r.bmin)}〜${yen(r.bmax)}（夜・1人の目安）</dd>
      <dt>最寄り</dt><dd>${r.st.name}駅から${walk(r.d)}（直線 ${(r.d/1000).toFixed(1)}km）</dd>
    </dl>
    <div class="summary"><h3>評価のポイント</h3><p>${r.note}</p></div>
    <div class="links">
      <h3>店舗情報・写真・口コミ</h3>
      <div class="btns">
        ${official}
        <a class="btn" href="${gm}" target="_blank" rel="noopener">Googleマップ<br>（店内写真・口コミ）</a>
        <a class="btn" href="https://www.google.com/search?tbm=isch&q=${q(r.n+' '+r.area+' 料理')}" target="_blank" rel="noopener">料理の写真</a>
        <a class="btn" href="https://www.google.com/search?q=${q('site:tabelog.com '+r.n+' '+r.area)}" target="_blank" rel="noopener">食べログ</a>
        <a class="btn" href="https://www.google.com/search?q=${q('site:retty.me '+r.n)}" target="_blank" rel="noopener">Retty</a>
        <a class="btn" href="https://www.google.com/search?q=${q('site:restaurant.ikyu.com '+r.n)}" target="_blank" rel="noopener">一休（予約）</a>
        <a class="btn" href="https://www.google.com/search?q=${q('site:hitosara.com '+r.n)}" target="_blank" rel="noopener">ヒトサラ</a>
      </div>
      <p class="fine">写真は著作権の関係でこのページに直接は載せず、各サイトで見られるようにしています。予算は推定値です。訪問前に各サイトで最新の情報を確認してください。</p>
    </div>`;
  box.hidden=false; lv.hidden=true; box.scrollTop=0;
  document.getElementById('back').onclick=()=>{state.sel=null; render(false);};
}

render(true);
window.addEventListener('load',()=>{map.invalidateSize(); render(true);});
new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
</script>
